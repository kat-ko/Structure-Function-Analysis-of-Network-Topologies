[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toy_task"
version = "0.1.0"
description = "Toy task extension: modular structure–function experiments (standalone)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.20",
  "torch>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.0",
  "pandas>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["toy_task*"]
